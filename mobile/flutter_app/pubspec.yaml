name: weathergpt
description: WeatherGPT — AI-powered weather assistant (Flutter client).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  audioplayers: ^6.7.1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon generation: run `dart run flutter_launcher_icons` from
# mobile/flutter_app after replacing assets/icon_source.jpeg.
flutter_launcher_icons:
  image_path: "assets/icon_source.jpeg"
  android: true
  web:
    generate: true
  windows:
    generate: true
