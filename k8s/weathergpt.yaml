# WeatherGPT Kubernetes manifests (bare-metal / minikube / any k8s cluster).
# Apply with: kubectl apply -f k8s/
---
apiVersion: v1
kind: Namespace
metadata:
  name: weathergpt
---
apiVersion: v1
kind: Secret
metadata:
  name: weathergpt-secrets
  namespace: weathergpt
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://weathergpt:weathergpt@postgres:5432/weathergpt
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: change_this_in_production
  GEMINI_API_KEY: ""
  MISTRAL_API_KEY: ""
  GROQ_API_KEY: ""
  LLM_PROVIDER_ORDER: gemini,mistral,groq
  FIREBASE_SERVICE_ACCOUNT_JSON: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: weathergpt
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: weathergpt}
            - {name: POSTGRES_PASSWORD, value: weathergpt}
            - {name: POSTGRES_DB, value: weathergpt}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "weathergpt"]}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: weathergpt
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: weathergpt
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weathergpt
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weathergpt
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: weathergpt
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: weathergpt-api:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef:
                name: weathergpt-secrets
          env:
            - {name: APP_ENV, value: production}
            - {name: DEBUG, value: "false"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: weathergpt
spec:
  type: ClusterIP
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: weathergpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: weathergpt
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 80}
